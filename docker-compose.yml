services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_API_URL: ${JAVA_API_URL:-http://host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sessions:/var/www/html/storage/framework/sessions
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      assets:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - build_assets:/var/www/html/public/build:ro
  assets:
    build: .
    command: ["sh", "-c", "cp -r /var/www/html/public/build/. /assets/"]
    user: root
    volumes:
      - build_assets:/assets
    restart: "no"
volumes:
  sessions:
  build_assets:
